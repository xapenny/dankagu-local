syntax = "proto3";

package takasho.schema.fes.resource.club_player_invitation.v1;

import "takasho/schema/common_featureset/resource/ondemand_master/v2.proto";
import "takasho/schema/fes/resource/club/v1.proto";

message ClubPlayerInvitation {
  string invitation_id = 1;
  takasho.schema.fes.resource.club.v1.Club club = 2;
  repeated takasho.schema.common_featureset.resource.ondemand_master.v2.Entry player_storage_entries = 3;
  string player_id = 4;
  string nickname = 5;
  sint64 invited_at = 6;
  uint64 club_players_count = 7;
}