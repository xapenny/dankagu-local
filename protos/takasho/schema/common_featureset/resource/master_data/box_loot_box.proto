syntax = "proto3";

package takasho.schema.common_featureset.resource.master_data.box_loot_box;

import "takasho/schema/common_featureset/resource/consume_resource_set/v1.proto";
import "takasho/schema/common_featureset/resource/loot_box/v1.proto";
import "takasho/schema/common_featureset/resource/player_inventory/v1.proto";

message BoxLootBoxContent {
  string box_loot_box_content_id = 1;
  takasho.schema.common_featureset.resource.player_inventory.v1.ItemType item_type = 2;
  string schema_key = 3;
  string value_path = 4;
  sint64 amount = 5;
  string search_label = 6;
}

message BoxLootBoxProduct {
  string box_loot_box_product_id = 1;
  string inventory_message = 2;
  sint64 opened_at = 3;
  sint64 closed_at = 4;
  repeated BoxLootBoxContent contents = 5;
  sint64 box_reset_count_limit = 6;
  bool has_extra = 7;
  repeated takasho.schema.common_featureset.resource.loot_box.v1.Extra extras = 8;
  repeated takasho.schema.common_featureset.resource.consume_resource_set.v1.ConsumeResourceSet consume_resource_sets = 9;
  string transaction_payload = 10;
}