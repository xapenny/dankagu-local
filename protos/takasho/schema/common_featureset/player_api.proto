syntax = "proto3";

package takasho.schema.common_featureset.player_api;

import "takasho/schema/common_featureset/resource/achievement/v1.proto";
import "takasho/schema/common_featureset/resource/total_login_bonus/v1.proto";

message Failure {
  string player_id = 1;
  int32 failure_reason = 3;  // client enum, wire-compatible varint
}

enum FailureReason {
  NotFail = 0;
  ReceiverHasNoFriendVacancy = 1;
  SenderHasNoFriendVacancy = 2;
  ReceiverNotAllowRequest = 3;
}

message Record {
  takasho.schema.common_featureset.resource.total_login_bonus.v1.TotalLoginBonus total_login_bonus = 1;
  sint64 received_at = 2;
}

message Response {
  repeated takasho.schema.common_featureset.resource.achievement.v1.Achievement achievements = 1;
  string next_page_token = 2;
  string prev_page_token = 3;
}

message Result {
  string subscription_product_id = 1;
  sint64 purchased_count = 2;
}